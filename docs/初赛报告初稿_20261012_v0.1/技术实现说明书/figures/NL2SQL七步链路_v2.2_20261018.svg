<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="642" viewBox="0 0 1140 642" role="img" aria-labelledby="t d">
<title id="t">NL2SQL 七步链路</title>
<desc id="d">结构化问数的七个处理步骤。上排自左向右为输入标准化与要素记录、语义澄清与会话恢复、表字段定位、外键路径与查询粒度；下排自右向左为候选 SQL 生成与校验、有限修复与执行异常、只读执行与大结果管理。条件不足时向用户提问并等待补充，补充后回到原问题；重写一次仍失败则报错，不下发猜测答案。</desc>
<defs>
<marker id="arr-blue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 12 6.5 1 12" fill="none" stroke="#0074e8" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arr-purple" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 12 6.5 1 12" fill="none" stroke="#a319d6" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arr-green" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 12 6.5 1 12" fill="none" stroke="#339d00" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arr-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11" fill="none" stroke="#e47c00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arr-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11" fill="none" stroke="#c99700" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<filter id="hand-ink" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency=".055" numOctaves="1" seed="17" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="2.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
