services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      BGE_EMBEDDING_MODEL: /app/models/bge-m3
      BGE_RERANKER_MODEL: /app/models/bge-reranker-v2-m3
      HF_HUB_OFFLINE: "1"
    ports:
      - "8000:8000"
